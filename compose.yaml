name: scooter-rentals

services:
  redis:
    image: redis:7-alpine
    container_name: scooter-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: scooter-api
    environment:
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

networks:
  backend:

volumes:
  redis-data:
